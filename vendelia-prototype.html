<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendelia Prototyyppi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (from brief) ---------- */
:root{
  --indigo:#3B32B3; --indigo-600:#2F279A; --indigo-50:#EEEDFA; --indigo-100:#DCDAF5;
  --navy:#17223B; --navy-70:#4A5468; --navy-50:#6B7385;
  --soft:#F7F8FC; --white:#FFFFFF; --line:#E3E5EE;
  --teal:#0B7A75; --teal-50:#E3F2F1;
  --warn:#8A5A00; --warn-50:#FFF4DC;
  --danger:#B42318; --danger-50:#FDECEA;
  --radius:12px; --radius-sm:8px;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px; --s8:64px;
  --shadow:0 1px 2px rgba(23,34,59,.06),0 4px 16px rgba(23,34,59,.06);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--navy);font:400 16px/1.5 var(--font)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.2}
h1{font-size:clamp(28px,5vw,44px)}
h2{font-size:clamp(22px,3vw,28px)}
h3{font-size:18px}
p{margin:0}
a{color:var(--indigo)}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--s2)}
@media(min-width:768px){.wrap{padding:0 var(--s3)}}
.muted{color:var(--navy-70)}
.small{font-size:14px}
.stack>*+*{margin-top:var(--s2)}
.row{display:flex;gap:var(--s1);align-items:center}
.between{justify-content:space-between}
.wrap-row{flex-wrap:wrap}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- Prototype bar ---------- */
.protobar{background:var(--navy);color:#fff;font-size:13px}
.protobar .wrap{display:flex;gap:var(--s2);align-items:center;min-height:40px;overflow-x:auto;white-space:nowrap}
.protobar a,.protobar button{color:#fff;opacity:.8;text-decoration:none;padding:4px 0;background:none;border:0;cursor:pointer;font-size:13px}
.protobar a:hover,.protobar a[aria-current="page"],.protobar button:hover{opacity:1;text-decoration:underline}
.protobar .tag{background:rgba(255,255,255,.14);padding:2px 8px;border-radius:999px;font-weight:600}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 var(--s3);border-radius:var(--radius-sm);border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s;text-align:center}
.btn-primary{background:var(--indigo);color:#fff}
.btn-primary:hover{background:var(--indigo-600)}
.btn-secondary{background:#fff;color:var(--navy);border-color:#C9CDDA}
.btn-secondary:hover{border-color:var(--navy-50)}
.btn-ghost{background:transparent;color:var(--indigo);padding:0 var(--s1)}
.btn-danger{background:#fff;color:var(--danger);border-color:#F0C4BF}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:0 var(--s2);font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-weight:500;font-size:14px}
.req{color:var(--danger)}
.input,.select,textarea.input{min-height:48px;padding:0 14px;border:1px solid #C9CDDA;border-radius:var(--radius-sm);background:#fff;width:100%}
textarea.input{padding:12px 14px;min-height:96px;resize:vertical}
.input:focus,.select:focus{border-color:var(--indigo);outline:3px solid var(--indigo-100);outline-offset:0}
.input[aria-invalid="true"]{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.err-msg{font-size:13px;color:var(--danger);display:flex;gap:6px;align-items:center}
.err-msg .icon{width:16px;height:16px}
.hint{font-size:13px;color:var(--navy-70)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--indigo);flex:none}

/* ---------- Header ---------- */
header.site{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hdr{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2);align-items:center;min-height:68px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);min-height:44px}
.logo svg{height:34px;width:auto}
.logo .sub{font-weight:600;font-size:15px}
.city-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-weight:500;font-size:14px;justify-self:start}
.city-btn .icon{width:18px;height:18px;color:var(--teal)}
.search{position:relative}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--navy-50)}
.search input{padding-left:44px;border-radius:999px;background:var(--soft);border-color:var(--line)}
.nav{display:flex;gap:4px;align-items:center}
.nav a,.nav .navbtn{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:0 10px;color:var(--navy);text-decoration:none;font-weight:500;font-size:15px;border-radius:var(--radius-sm);background:none;border:0;cursor:pointer}
.nav a:hover,.nav .navbtn:hover{background:var(--soft)}
.badge{position:absolute;top:4px;right:2px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--indigo);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}
.hdr-search{display:none}
.hdr-row2{padding-bottom:12px;display:flex;gap:var(--s1)}
.hdr-row2 .search{flex:1}
.nav .lbl{display:none}
@media(min-width:960px){
  .hdr{grid-template-columns:auto auto 1fr auto}
  .hdr-search{display:block}
  .hdr-row2{display:none}
  .nav .lbl{display:inline}
  .nav .navbtn.cart .badge{position:static;margin-left:2px}
}
.lang{font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:999px;min-height:36px;padding:0 10px;background:#fff}

/* ---------- Cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:var(--s3)}
.grid{display:grid;gap:var(--s3)}
.deals{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.deal{display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s}
.deal:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(23,34,59,.06),0 12px 28px rgba(23,34,59,.10)}
.media{display:block;aspect-ratio:3/2;background:linear-gradient(135deg,var(--indigo-50),var(--teal-50));position:relative;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover}
.media .chip{position:absolute;left:12px;top:12px}
.deal .body{padding:var(--s2);display:flex;flex-direction:column;gap:6px;flex:1}
.deal h3 a{color:inherit;text-decoration:none}
.deal h3 a:hover{text-decoration:underline}
.meta{font-size:14px;color:var(--navy-70);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta .icon{width:16px;height:16px}
.deal h3{font-size:17px;line-height:1.35}
.price-row{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:var(--s1);flex-wrap:wrap}
.price{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.from{font-size:14px;font-weight:500;color:var(--navy-70)}
.ref{font-size:14px;color:var(--navy-70);text-decoration:line-through}
.restrict{font-size:13px;color:var(--navy-70)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#fff;color:var(--navy)}
.chip.teal{background:var(--teal-50);color:var(--teal)}
.chip.indigo{background:var(--indigo-50);color:var(--indigo)}
.chip.warn{background:var(--warn-50);color:var(--warn)}
.chip.danger{background:var(--danger-50);color:var(--danger)}
.chip.grey{background:#EEF0F5;color:var(--navy-70)}
.chip .icon{width:14px;height:14px}

/* ---------- Home ---------- */
.hero{padding:var(--s5) 0 var(--s4)}
.hero p.lead{font-size:18px;color:var(--navy-70);max-width:600px;margin-top:var(--s2)}
.hero-search{margin-top:var(--s3);display:grid;gap:var(--s1);max-width:760px}
@media(min-width:640px){.hero-search{grid-template-columns:220px 1fr auto}}
.cities{display:flex;gap:var(--s2);overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.city{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;min-width:76px;font-size:14px;font-weight:500;color:var(--navy);padding:0}
.city .c{width:64px;height:64px;border-radius:50%;border:2px solid var(--indigo);display:grid;place-items:center;font-weight:700;color:var(--indigo);background:#fff;letter-spacing:.02em;transition:background .15s}
.city:hover .c{background:var(--indigo-50)}
.city[aria-pressed="true"] .c{background:var(--indigo);color:#fff}
.cats{display:flex;gap:var(--s1);overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 var(--s2) 0 10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--navy);font-weight:500;white-space:nowrap;cursor:pointer}
.cat .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--indigo-50);color:var(--indigo)}
.cat[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-50)}
section{padding:var(--s4) 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:var(--s2);margin-bottom:var(--s3)}
.steps{grid-template-columns:1fr}
@media(min-width:768px){.steps{grid-template-columns:repeat(4,1fr)}}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;margin-bottom:12px}
.merchant-cta{background:var(--navy);color:#fff;border-radius:var(--radius);padding:var(--s4);display:grid;gap:var(--s3)}
@media(min-width:768px){.merchant-cta{grid-template-columns:1.4fr 1fr;align-items:center;padding:var(--s6)}}
.merchant-cta ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.merchant-cta li{display:flex;gap:10px;align-items:flex-start}
.merchant-cta li .icon{color:#7FD6CF;margin-top:2px}
.merchant-cta .btn-primary{background:#fff;color:var(--navy)}
.merchant-cta .btn-primary:hover{background:var(--indigo-50)}
footer.site{border-top:1px solid var(--line);background:#fff;margin-top:var(--s6);padding:var(--s5) 0 var(--s4)}
.foot{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.foot h4{font-size:14px;margin-bottom:12px}
.foot a{display:block;color:var(--navy-70);text-decoration:none;padding:6px 0;font-size:15px}
.foot a:hover{color:var(--indigo)}
.legal{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line);font-size:13px;color:var(--navy-70);display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:space-between}
.paylogos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.paylogos span{font-size:12px;font-weight:700;color:var(--navy-70);border:1px solid var(--line);border-radius:6px;padding:4px 8px}

/* ---------- Listing ---------- */
.filters{display:flex;gap:var(--s1);flex-wrap:wrap;margin-bottom:var(--s2)}
.empty{text-align:center;padding:var(--s6) var(--s2)}

/* ---------- Deal detail ---------- */
.crumbs{font-size:14px;padding:var(--s2) 0;color:var(--navy-70);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--navy-70)}
.detail{display:grid;gap:var(--s4)}
@media(min-width:960px){.detail{grid-template-columns:1fr 400px;align-items:start}}
.gallery{border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:linear-gradient(135deg,var(--indigo-50),var(--teal-50))}
.gallery img{width:100%;height:100%;object-fit:cover}
.buybox{position:sticky;top:96px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px}
.kv dt{color:var(--navy-70)}
.kv dd{margin:0;font-weight:500}
ul.ticks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
ul.ticks li{display:flex;gap:10px}
ul.ticks .icon{color:var(--teal);margin-top:2px}
ul.dots{margin:0;padding-left:20px;display:grid;gap:6px}
ol.nums{margin:0;padding-left:22px;display:grid;gap:8px}
.notice{display:flex;gap:12px;padding:var(--s2);border-radius:var(--radius-sm);background:var(--teal-50);color:var(--navy);font-size:15px}
.notice .icon{color:var(--teal);margin-top:2px}
.notice.indigo{background:var(--indigo-50)}
.notice.indigo .icon{color:var(--indigo)}
.notice.warn{background:var(--warn-50)}
.notice.warn .icon{color:var(--warn)}
.notice.danger{background:var(--danger-50)}
.notice.danger .icon{color:var(--danger)}
.merchant{display:flex;gap:var(--s2);align-items:center}
.avatar{width:48px;height:48px;border-radius:12px;background:var(--indigo-50);color:var(--indigo);display:grid;place-items:center;font-weight:700;flex:none}
.map{height:160px;border-radius:var(--radius-sm);background:
  linear-gradient(0deg,rgba(255,255,255,.5),rgba(255,255,255,.5)),
  repeating-linear-gradient(45deg,#E7EAF3 0 2px,transparent 2px 22px),
  repeating-linear-gradient(-45deg,#E7EAF3 0 2px,transparent 2px 30px),#F1F3F9;
  display:grid;place-items:center;color:var(--indigo)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:68px;background:var(--soft);z-index:5}
@media(min-width:960px){.tabs{top:68px}}
.tabs a{padding:12px 14px;min-height:44px;color:var(--navy-70);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--navy);border-bottom-color:var(--indigo-100)}
.opt{display:flex;align-items:center;gap:12px;padding:0 var(--s2);min-height:56px;border:1px solid #C9CDDA;border-radius:var(--radius-sm);cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--indigo);background:var(--indigo-50);box-shadow:inset 0 0 0 1px var(--indigo)}
.opt input{accent-color:var(--indigo);width:20px;height:20px;flex:none}
.opt .p{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.mobile-buy{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px var(--s2);display:flex;gap:var(--s2);align-items:center;justify-content:space-between;z-index:15;box-shadow:0 -4px 16px rgba(23,34,59,.08)}
@media(min-width:960px){.mobile-buy{display:none}}
.has-mobile-buy{padding-bottom:96px}
@media(min-width:960px){.has-mobile-buy{padding-bottom:0}}

/* ---------- Cart / checkout ---------- */
.checkout{display:grid;gap:var(--s3)}
@media(min-width:960px){.checkout{grid-template-columns:1fr 400px;align-items:start}}
.checkout aside{position:sticky;top:96px}
.summary-line{display:flex;justify-content:space-between;gap:var(--s2);font-size:15px;padding:6px 0;font-variant-numeric:tabular-nums}
.summary-line.total{font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.pay-opts{display:grid;gap:var(--s1)}
.pay-opt{display:flex;align-items:center;gap:12px;padding:12px var(--s2);min-height:56px;border:1px solid #C9CDDA;border-radius:var(--radius-sm);cursor:pointer;background:#fff;width:100%;text-align:left}
.pay-opt:has(input:checked){border-color:var(--indigo);background:var(--indigo-50);box-shadow:inset 0 0 0 1px var(--indigo)}
.pay-opt input{accent-color:var(--indigo);width:20px;height:20px;flex:none}
.pay-opt .brand{margin-left:auto;font-size:12px;font-weight:700;color:var(--navy-70);letter-spacing:.04em}
.pay-opt .d{display:block;font-size:13px;color:var(--navy-70);font-weight:400}
.banks{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:4px}
.bank{position:relative;min-height:52px;border:1px solid #C9CDDA;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;background:#fff;text-align:center;padding:4px 8px;font-size:14px}
.bank input{position:absolute;opacity:0;pointer-events:none}
.bank:has(input:checked){border-color:var(--indigo);background:var(--indigo-50);box-shadow:inset 0 0 0 1px var(--indigo);color:var(--indigo)}
.bank:has(input:focus-visible){outline:3px solid var(--indigo);outline-offset:2px}
.qty{display:inline-flex;align-items:center;border:1px solid #C9CDDA;border-radius:var(--radius-sm);background:#fff}
.qty button{width:44px;height:44px;border:0;background:none;cursor:pointer;font-size:20px;line-height:1}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty output{min-width:32px;text-align:center;font-weight:600}
.stepper{display:flex;gap:var(--s1);font-size:14px;color:var(--navy-70);margin-bottom:var(--s3);flex-wrap:wrap;align-items:center}
.stepper span{display:flex;gap:6px;align-items:center}
.stepper .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid #C9CDDA;font-size:12px;font-weight:700}
.stepper .on{color:var(--navy);font-weight:600}
.stepper .on .n{background:var(--indigo);border-color:var(--indigo);color:#fff}
.stepper .done .n{background:var(--teal);border-color:var(--teal);color:#fff}
.line{display:grid;grid-template-columns:80px 1fr;gap:var(--s2);padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .thumb{width:80px;height:64px;border-radius:10px;overflow:hidden;background:var(--indigo-50)}
.line .thumb img{width:100%;height:100%;object-fit:cover}
.line h3{font-size:16px;line-height:1.35}
.line h3 a{color:inherit;text-decoration:none}
.line h3 a:hover{text-decoration:underline}
.line .ctrl{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.line .lt{font-weight:700;font-variant-numeric:tabular-nums}
.mini-line{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14px}
.mini-line .thumb{width:56px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--indigo-50)}
.mini-line .thumb img{width:100%;height:100%;object-fit:cover}
.mini-line .t{flex:1;min-width:0}
.mini-line .t b{display:block;font-weight:600;line-height:1.3}
.err-sum{border:2px solid var(--danger);background:var(--danger-50);border-radius:var(--radius-sm);padding:var(--s2)}
.err-sum ul{margin:8px 0 0;padding-left:20px}
.err-sum a{color:var(--danger);font-weight:500}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}

/* ---------- Voucher ---------- */
.voucher{display:grid;gap:var(--s3);border:2px dashed var(--indigo-100)}
@media(min-width:720px){.voucher{grid-template-columns:auto 1fr}}
.qr{width:152px;height:152px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm)}
.code{font:600 18px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
.success-ic{width:56px;height:56px;border-radius:50%;background:var(--teal-50);color:var(--teal);display:grid;place-items:center}
.success-ic .icon{width:28px;height:28px}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;font-weight:600;color:var(--navy-70);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sum td{font-weight:700;border-bottom:0}

/* ---------- Purchases ---------- */
.purchase{display:grid;grid-template-columns:72px 1fr;gap:var(--s2);padding:var(--s2)}
@media(min-width:720px){.purchase{grid-template-columns:96px 1fr auto;align-items:center}}
.purchase .thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--indigo-50)}
@media(min-width:720px){.purchase .thumb{width:96px;height:72px}}
.purchase .thumb img{width:100%;height:100%;object-fit:cover}
.purchase .actions{grid-column:1/-1;display:flex;gap:var(--s1);flex-wrap:wrap}
@media(min-width:720px){.purchase .actions{grid-column:auto;justify-content:flex-end}}

/* ---------- Business portal ---------- */
.portal{display:grid;min-height:calc(100vh - 40px)}
@media(min-width:960px){.portal{grid-template-columns:260px 1fr}}
.side{background:#fff;border-right:1px solid var(--line);padding:var(--s2)}
.side .logo{padding:4px 8px var(--s2)}
.side nav{display:flex;gap:4px;overflow-x:auto}
@media(min-width:960px){.side nav{flex-direction:column}}
.side nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);color:var(--navy);text-decoration:none;font-weight:500;white-space:nowrap}
.side nav a:hover{background:var(--soft)}
.side nav a[aria-current="page"]{background:var(--indigo-50);color:var(--indigo)}
.side .biz{display:none;margin-top:var(--s4);padding:12px;border-radius:var(--radius-sm);background:var(--soft);font-size:14px}
@media(min-width:960px){.side .biz{display:block}}
.main{padding:var(--s3) var(--s2) var(--s6)}
@media(min-width:768px){.main{padding:var(--s4)}}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s2)}
.kpi .v{font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.form-grid{display:grid;gap:var(--s2)}
@media(min-width:720px){.form-grid.two{grid-template-columns:1fr 1fr}}
.split{display:grid;gap:var(--s3)}
@media(min-width:1100px){.split{grid-template-columns:1fr 400px;align-items:start}}
.breakdown .summary-line{font-size:14px}
.breakdown .summary-line.total{font-size:17px}
.redeem-result{margin-top:var(--s2)}

/* ---------- Dialogs / drawer ---------- */
dialog{border:0;border-radius:var(--radius);padding:0;max-width:480px;width:calc(100% - 32px);box-shadow:0 24px 64px rgba(23,34,59,.25);color:var(--navy)}
dialog::backdrop{background:rgba(23,34,59,.45)}
dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(440px,100%);max-width:100%;border-radius:0;flex-direction:column}
dialog.drawer[open]{display:flex}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line)}
.drawer-body{flex:1;overflow:auto;padding:0 var(--s3)}
.drawer-foot{border-top:1px solid var(--line);padding:var(--s2) var(--s3) var(--s3);display:grid;gap:var(--s1)}
.spin{width:44px;height:44px;border:4px solid var(--indigo-100);border-top-color:var(--indigo);border-radius:50%;animation:sp .9s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--navy);color:#fff;padding:12px 20px;border-radius:var(--radius-sm);font-weight:500;z-index:50;transition:.25s;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:3s!important}}

function addMonths(d, m){ // kalenterikuukaudet, rajataan kuun loppuun
  d = new Date(d);
  const t = new Date(d.getFullYear(), d.getMonth()+m, 1);
  const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(d.getDate(), last)); return t;
}
function addDays(d,n){const t=new Date(d);t.setDate(t.getDate()+n);return t}
function split(gross, vatRate, commissionRate=15, commVat=25.5){
  const net = r2(gross/(1+vatRate/100));
  const saleVat = r2(gross-net);
  const comm = r2(net*commissionRate/100);
  const cVat = r2(comm*commVat/100);
  return {gross, net, saleVat, comm, cVat, fee:r2(comm+cVat), payout:r2(gross-comm-cVat)};
}

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} updateBadge(); }

/* ================= Cart ================= */
const cartKey = (d,o) => `${d}:${o}`;
function cartLines(){
  return S.cart.map(c=>{ const d=deal(c.deal), o=optOf(d,c.opt); return {...c, key:cartKey(c.deal,c.opt), d, o, unit:o.price, total:r2(o.price*c.qty)}; });
}
function cartTotals(){
  const lines = cartLines(); const vat = {};
  let total = 0, count = 0;
  for(const l of lines){ total+=l.total; count+=l.qty; vat[l.d.vat] = r2((vat[l.d.vat]||0) + r2(l.total - l.total/(1+l.d.vat/100))); }
  return {lines, total:r2(total), count, vat};
}
function addToCart(dealId, optId, qty){
  const ex = S.cart.find(c=>c.deal===dealId && c.opt===optId);
  if(ex) ex.qty = Math.min(10, ex.qty+qty); else S.cart.push({deal:dealId, opt:optId, qty:Math.min(10,qty)});
  save(); openDrawer(true);
}
function setQty(key, delta){
  const c = S.cart.find(c=>cartKey(c.deal,c.opt)===key); if(!c) return;
  c.qty = Math.max(1, Math.min(10, c.qty+delta)); save();
}
function removeLine(key){ S.cart = S.cart.filter(c=>cartKey(c.deal,c.opt)!==key); save(); }
function updateBadge(){
  const n = S.cart.reduce((a,c)=>a+c.qty,0);
  document.querySelectorAll("[data-cart-count]").forEach(el=>{ el.textContent=n; el.hidden=!n; });
  document.querySelectorAll("[data-act=drawer]").forEach(el=>el.setAttribute("aria-label",`Ostoskori, ${plural(n,"tuote","tuotetta")}`));
}
function vatLines(vat){
  return Object.keys(vat).sort((a,b)=>b-a).map(r=>`<div class="summary-line muted"><span>Sisältää ALV ${pct(r)}</span><span>${eur(vat[r])}</span></div>`).join("");
}

function qrSVG(code){
  const N=25, cells=[]; let h=0;
  for(const ch of code) h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
  const finder=(x,y)=>x<7&&y<7||x>=N-7&&y<7||x<7&&y>=N-7;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(!finder(x,y)&&rnd()>.52) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`); }
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg class="qr" viewBox="0 0 ${N} ${N}" role="img" aria-label="QR-koodi lahjakortille ${code} (prototyyppi)" shape-rendering="crispEdges" fill="#17223B">${cells.join("")}${f(0,0)}${f(N-7,0)}${f(0,N-7)}</svg>`;
}

  const exp = addMonths(v.bought,3);

  if(v.status==="refunded") return `<span class="chip danger">${ic("refund")}Hyvitetty</span>`;
  if(exp < TODAY) return `<span class="chip grey">${ic("clock")}Vanhentunut</span>`;
  const days = Math.round((exp-TODAY)/864e5);
  return days<=14 ? `<span class="chip warn">${ic("clock")}Vanhenee ${days} päivän kuluttua</span>` : `<span class="chip teal">${ic("checkc")}Voimassa</span>`;

          <div class="field"><label for="nv">Palvelun ALV-kanta</label><select class="select" id="nv" name="vat"><option value="25.5">25,5 % – yleinen</option><option value="13.5">13,5 % – ruoka, ravintolat, liikunta, kulttuuri</option><option value="10">10 % – alennettu</option></select><span class="hint">Tarkista kirjanpitäjältäsi, jos olet epävarma.</span></div>
        </div>
        <div class="field"><label for="nr">Normaalihinta (valinnainen)</label><input class="input" id="nr" type="number" min="0" step="0.01" placeholder="esim. 45,00" aria-describedby="nr-h"><span class="hint" id="nr-h">Syötä vain hinta, jolla olet todella myynyt palvelua viime aikoina. Se näytetään vertailuhintana.</span></div>
        <div class="field"><label for="ni">Mitä hintaan sisältyy (yksi per rivi)</label><textarea class="input" id="ni">30 minuutin selkä- ja niskahieronta
Yrttitee hoidon jälkeen</textarea></div>
        <div class="field"><label for="nx">Ehdot (yksi per rivi)</label><textarea class="input" id="nx">Voimassa ma–pe
Yksi lahjakortti per henkilö per käynti</textarea></div>
        <div class="field"><label for="nb">Ajanvarausohjeet</label><textarea class="input" id="nb">Varaa aika puhelimitse vähintään 24 h etukäteen ja mainitse lahjakortin koodi.</textarea></div>
        <div class="field"><label for="nimg">Kuvat</label><input class="input" id="nimg" type="file" accept="image/*" style="padding-top:11px"><span class="hint">Käytä aitoja kuvia tiloistasi tai palvelustasi.</span></div>
        <div class="row wrap-row"><button class="btn btn-primary" type="submit">Lähetä tarkastettavaksi</button><button class="btn btn-secondary" type="button" data-act="toast" data-msg="Luonnos tallennettu">Tallenna luonnos</button></div>
      </div>
      <aside class="card pad stack breakdown" aria-labelledby="bd" style="position:sticky;top:24px">
        <h2 id="bd" style="font-size:18px">Mitä saat lahjakorttia kohden</h2>
        <div id="bdl" aria-live="polite"></div>
        <p class="hint">Provisio on 15 % arvonlisäverottomasta myynnistä. Provision ALV 25,5 % on vähennettävissä ALV-rekisteröidyille yrityksille. Tilitetään lunastuksen jälkeen.</p>
      </aside>
    </form>`);
}
function renderBreakdown(){
  const price = parseFloat(document.getElementById("np").value)||0;
  const vat = parseFloat(document.getElementById("nv").value);
  const s = split(price, vat);
  const L=(a,b,cls="")=>`<div class="summary-line ${cls}"><span>${a}</span><span>${b}</span></div>`;
  document.getElementById("bdl").innerHTML =
    L("Asiakas maksaa (sis. ALV)", eur(s.gross)) +
    L(`Myynnin ALV ${pct(vat)} (ilmoitat itse)`, eur(s.saleVat),"muted") +
    L("Provisiopohja (ALV 0 %)", eur(s.net),"muted") +
    L("Provisio 15 %", "−"+eur(s.comm)) +
    L("Provision ALV 25,5 %", "−"+eur(s.cVat)) +
    L("Tilityksesi", eur(s.payout),"total") +
    `<p class="hint" style="margin-top:8px">Vähennykset yhteensä ${eur(s.fee)} = ${(s.gross?s.fee/s.gross*100:0).toFixed(1).replace(".",",")} % asiakashinnasta.</p>`;
}

function BizRedeem(){
  const active = S.vouchers.filter(v=>v.status==="active" && deal(v.deal).merchant==="Näyte Wellness");
  return portal("#/yritys/lunasta", `
    <h1 style="font-size:28px">Lunasta lahjakortti</h1>
    <p class="muted" style="margin-top:4px">Skannaa asiakkaan QR-koodi tai kirjoita koodi. Kukin lahjakortti voidaan lunastaa vain kerran.</p>
    <div class="split" style="margin-top:var(--s3)">
      <div class="card pad stack">
        <button class="btn btn-secondary btn-block" style="min-height:120px;flex-direction:column;border-style:dashed" data-act="toast" data-msg="Kamera avautuu tästä puhelimella">${ic("scan")}<span>Skannaa QR-koodi</span></button>
        <form data-act="redeem" class="stack">
          <div class="field"><label for="rc">Tai syötä lahjakortin koodi</label><input class="input mono" id="rc" name="code" autocomplete="off" autocapitalize="characters" placeholder="VND-XXXX-XXXX" style="letter-spacing:.05em;text-transform:uppercase"></div>
          <button class="btn btn-primary btn-block" type="submit">Tarkista koodi</button>
        </form>
        <div id="rr" class="redeem-result" aria-live="polite"></div>
      </div>
      <aside class="card pad stack">
        <h2 style="font-size:18px">Kokeile</h2>
        <p class="muted small">Yrityksesi voimassa olevat esimerkkilahjakortit:</p>
        ${active.length?active.map(v=>`<button class="btn btn-ghost btn-sm mono" style="justify-content:flex-start" data-act="fill" data-code="${v.code}">${v.code}</button>`).join(""):'<p class="small">Ei yhtään. Osta kuumakivihieronta asiakaspuolella, niin saat koodin.</p>'}
        <p class="muted small">Käytetyt, hyvitetyt ja muiden yritysten koodit hylätään, ja syy näytetään.</p>
      </aside>
    </div>`);
}

function BizPayouts(){
  const rows = [
    {d:"Kuumakivihieronta 60 min", n:17, price:59, vat:25.5, ref:1},
    {d:"Parihieronta 90 min", n:4, price:139, vat:25.5, ref:0},
  ];
  let T={gross:0,saleVat:0,net:0,comm:0,cVat:0,refund:0,payout:0};
  const lines = rows.map(r=>{
    const s = split(r.price*r.n, r.vat), refund = r.ref*r.price, rs = split(refund, r.vat);
    const payout = r2(s.payout - rs.payout);
    T.gross+=s.gross;T.saleVat+=s.saleVat;T.net+=s.net;T.comm+=s.comm-rs.comm;T.cVat+=s.cVat-rs.cVat;T.refund+=refund;T.payout+=payout;
    return `<tr><td>${esc(r.d)}<div class="hint">${r.n} myyty · ${r.ref} hyvitetty</div></td><td class="num">${eur(s.gross)}</td><td class="num">${eur(s.saleVat)}</td><td class="num">${eur(s.net)}</td><td class="num">${eur(r2(s.comm-rs.comm))}</td><td class="num">${eur(r2(s.cVat-rs.cVat))}</td><td class="num">${refund?"−"+eur(refund):eur(0)}</td><td class="num"><b>${eur(payout)}</b></td></tr>`;
  }).join("");
  Object.keys(T).forEach(k=>T[k]=r2(T[k]));
  return portal("#/yritys/tilitykset", `
    <div class="row between wrap-row" style="gap:16px"><div><h1 style="font-size:28px">Tilitykset ja raportit</h1><p class="muted">Tilityskausi 1.–15.10.2026 · esimerkkidata</p></div>
      <button class="btn btn-secondary" data-act="toast" data-msg="CSV-vienti alkaa tästä">${ic("doc")} Vie CSV</button></div>
    <div class="grid kpis" style="margin-top:var(--s3)">
      <div class="card pad kpi"><p class="muted small">Tilityssumma</p><p class="v">${eur(T.payout)}</p></div>
      <div class="card pad kpi"><p class="muted small">Tila</p><p class="v" style="font-size:20px"><span class="chip warn">${ic("clock")}Ajastettu 21.10.</span></p></div>
      <div class="card pad kpi"><p class="muted small">Tilitystili</p><p class="v" style="font-size:18px">FI•• •••• •••• 1234</p></div>
    </div>
    <div class="card" style="margin-top:var(--s3)"><div class="table-wrap"><table>
      <thead><tr><th>Diili</th><th class="num">Myynti sis. ALV</th><th class="num">Myynnin ALV</th><th class="num">Provisiopohja</th><th class="num">Provisio</th><th class="num">Provision ALV</th><th class="num">Hyvitykset</th><th class="num">Tilitys</th></tr></thead>
      <tbody>${lines}<tr class="sum"><td>Yhteensä</td><td class="num">${eur(T.gross)}</td><td class="num">${eur(T.saleVat)}</td><td class="num">${eur(T.net)}</td><td class="num">${eur(T.comm)}</td><td class="num">${eur(T.cVat)}</td><td class="num">${T.refund?"−"+eur(T.refund):eur(0)}</td><td class="num">${eur(T.payout)}</td></tr></tbody>
    </table></div></div>
    <div class="notice indigo" style="margin-top:var(--s3)">${ic("info")}<p>Hyvitykset peruvat niihin liittyvän provision ja provision ALV:n. Tämän kauden provisiolasku toimitetaan tilityksen yhteydessä.</p></div>`);
}

/* ================= Router ================= */
let lastRoute = "";
function route(keepScroll){
  const h = location.hash || "#/";
  const [ , a, b] = h.split("/");
  const routeId = a+"/"+(b||"");
  if(routeId!==lastRoute){ ui.qty=1; ui.opt=null; if(a!=="kassa"){ ui.checkoutErrors=null; } }
  lastRoute = routeId;
  let html;
  if(!a) html = Home();
  else if(a==="tarjoukset") html = Browse();
  else if(a==="tarjous") html = Deal(b);
  else if(a==="ostoskori") html = Cart();
  else if(a==="kassa") html = Checkout();
  else if(a==="kiitos") html = Confirmation();
  else if(a==="omat") html = Vouchers();
  else if(a==="yritys") html = b==="uusi"?BizNew():b==="lunasta"?BizRedeem():b==="tilitykset"?BizPayouts():Biz();
  else html = NotFound();
  if(!html) return;
  document.getElementById("app").innerHTML = html;
  renderProtobar();
  if(!keepScroll) window.scrollTo(0,0);
  if(a==="yritys" && b==="uusi") renderBreakdown();
}
window.addEventListener("hashchange", ()=>route());

/* ================= Interactions ================= */
function toast(msg){
  const t=document.getElementById("toast"); t.innerHTML=ic("check")+esc(msg); t.classList.add("show");
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove("show"),2600);
}
const dlg = document.getElementById("dlg");
function openDialog(html){ dlg.innerHTML=html; dlg.showModal(); }
const rerender = () => route(true);

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act],[data-cat],[data-city],[data-catf],[data-jump],[data-focus]"); if(!el) return;
  if(el.dataset.jump!==undefined){ e.preventDefault(); document.querySelector(el.getAttribute("href"))?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(el.dataset.focus){ e.preventDefault(); document.getElementById(el.dataset.focus)?.focus(); return; }
  if(el.dataset.cat!==undefined && el.tagName==="A"){ ui.catFilter = el.dataset.cat||null; if(el.dataset.act!=="dclose") return; }
  if(el.dataset.city!==undefined){ ui.city=el.dataset.city; if(el.dataset.go){ location.hash="#/tarjoukset"; } else rerender(); return; }
  if(el.dataset.catf!==undefined){ ui.catFilter=el.dataset.catf||null; rerender(); return; }
  const act = el.dataset.act;
  if(act==="city"){
    openDialog(`<div class="pad stack"><div class="row between"><h2 style="font-size:20px">Valitse kaupunki</h2><button class="btn btn-ghost" data-act="close" aria-label="Sulje">${ic("x")}</button></div>
      <div class="stack" role="group" aria-label="Kaupungit">${[ALL,...CITIES.map(c=>c.name)].map(c=>`<button class="pay-opt" data-act="pickcity" data-v="${c}">${ic("pin")}<span>${c}</span>${c===ui.city?`<span class="brand" style="color:var(--indigo)">VALITTU</span>`:""}</button>`).join("")}</div></div>`);
  }
  if(act==="pickcity"){ ui.city=el.dataset.v; dlg.close(); rerender(); toast(`Näytetään: ${ui.city}`); }
  if(act==="close"){ dlg.close(); }
  if(act==="clear"){ ui.city=ALL; ui.q=""; ui.catFilter=null; rerender(); }
  if(act==="reset"){ try{localStorage.removeItem(KEY)}catch{} S=seed(); ui.lastOrder=null; location.hash="#/"; route(); toast("Demo nollattu"); }
  if(act==="how"){ e.preventDefault(); location.hash="#/"; setTimeout(()=>document.getElementById("how-sec")?.scrollIntoView(),60); }
  if(act==="dq"){
    ui.qty=Math.max(1,Math.min(10,ui.qty+Number(el.dataset.d)));
    document.getElementById("dqty").textContent=ui.qty;
    document.querySelectorAll('[data-act=dq]').forEach(b=>b.disabled = (b.dataset.d==="-1"&&ui.qty<=1)||(b.dataset.d==="1"&&ui.qty>=10));
  }
  if(act==="add"){ addToCart(el.dataset.deal, el.dataset.opt, 1); }
  if(act==="addsel"){ const d=deal(el.dataset.deal); addToCart(d.id, optOf(d,ui.opt).id, ui.qty); }
  if(act==="drawer"){ openDrawer(false); }
  if(act==="dclose"){ drawer.close(); }
  if(act==="cq"){ setQty(el.dataset.k, Number(el.dataset.d)); if(drawer.open) drawer.innerHTML=drawerHTML(false); rerender(); }
  if(act==="rm"){ removeLine(el.dataset.k); if(drawer.open) drawer.innerHTML=drawerHTML(false); rerender(); toast("Tuote poistettu ostoskorista"); }
  if(act==="toast") toast(el.dataset.msg);
  if(act==="show"){ ui.lastOrder=null; const v=S.vouchers.find(x=>x.code===el.dataset.code); ui.showCode=v.code;
    openDialog(`<div class="pad stack"><div class="row between"><h2 style="font-size:20px">Lahjakortti</h2><button class="btn btn-ghost" data-act="close" aria-label="Sulje">${ic("x")}</button></div></div><div style="padding:0 16px 16px">${voucherCard(v)}</div>`);
    dlg.style.maxWidth="760px"; }
  if(act==="cancel"){
    const v=S.vouchers.find(x=>x.code===el.dataset.code), d=deal(v.deal);
    dlg.style.maxWidth="";
    openDialog(`<div class="pad stack"><h2 style="font-size:20px">Perutaanko lahjakortti?</h2>
      <p>${esc(itemTitle(d,optOf(d,v.opt)))} · <span class="mono">${v.code}</span></p>
      <p class="muted">Lahjakortti lakkaa toimimasta heti. ${eur(v.price)} palautetaan alkuperäiselle maksutavalle, yleensä 5 arkipäivän kuluessa. Lähetämme vahvistuksen sähköpostiisi.</p>
      <div class="row wrap-row" style="justify-content:flex-end"><button class="btn btn-secondary" data-act="close">Pidä lahjakortti</button><button class="btn btn-primary" data-act="confirmcancel" data-code="${v.code}">Peru ja hyvitä</button></div></div>`);
  }
  if(act==="confirmcancel"){ const v=S.vouchers.find(x=>x.code===el.dataset.code); v.status="refunded"; save(); dlg.close(); rerender(); toast("Peruttu. Hyvitysvahvistus lähetetty sähköpostiin."); }
  if(act==="fill"){ document.getElementById("rc").value=el.dataset.code; document.getElementById("rc").focus(); }
  if(act==="doredeem"){
    const v=S.vouchers.find(x=>x.code===el.dataset.code); v.status="redeemed"; v.redeemed=+TODAY; save();
    document.getElementById("rr").innerHTML=`<div class="notice">${ic("checkc")}<p><b>Lunastettu.</b> ${v.code} on merkitty käytetyksi. ${eur(split(v.price,deal(v.deal).vat).payout)} lisätty seuraavaan tilitykseen.</p></div>`;
  }
});

document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.act==="city-select"){ ui.city=t.value; rerender(); }
  if(t.dataset.act==="opt"){ ui.opt=t.value; const d=deal(location.hash.split("/")[2]); const p=eur(optOf(d,ui.opt).price); document.getElementById("bprice").textContent=p; document.getElementById("mprice").textContent=p; }
  if(t.dataset.act==="gift"){ document.getElementById("giftf").hidden=!t.checked; if(t.checked) document.getElementById("gname").focus(); }
  if(t.dataset.act==="pm"){ document.getElementById("banks").hidden = t.value!=="bank"; }
  if(t.id==="nv") renderBreakdown();
});
document.addEventListener("input", e=>{ if(e.target.id==="np") renderBreakdown(); });
dlg.addEventListener("close", ()=>{ dlg.style.maxWidth=""; });
drawer.addEventListener("click", e=>{ if(e.target===drawer) drawer.close(); });

document.addEventListener("submit", e=>{
  const f=e.target, act=f.dataset.act; if(!act) return; e.preventDefault();
  if(act==="search"){ ui.q=f.q.value.trim(); ui.catFilter=null; if(location.hash==="#/tarjoukset") rerender(); else location.hash="#/tarjoukset"; }
  if(act==="pay"){
    const fd = Object.fromEntries(new FormData(f));
    const v = {email:fd.email?.trim(), fn:fd.fn?.trim(), ln:fd.ln?.trim(), tel:fd.tel, gift:!!fd.gift, gname:fd.gname?.trim(), gmsg:fd.gmsg, pm:fd.pm, bank:fd.bank, terms:!!fd.terms, news:!!fd.news};
    const errs = {};
    if(!/^\S+@\S+\.\S+$/.test(v.email||"")) errs.email = "Anna toimiva sähköpostiosoite.";
    if(!v.fn) errs.fn = "Anna etunimi.";
    if(!v.ln) errs.ln = "Anna sukunimi.";
    if(v.gift && !v.gname) errs.gname = "Anna lahjan saajan nimi.";
    if(v.pm==="bank" && !v.bank) errs.bank = "Valitse pankkisi.";
    if(!v.terms) errs.terms = "Hyväksy ehdot jatkaaksesi.";
    ui.form = v;
    if(Object.keys(errs).length){ ui.checkoutErrors = errs; rerender(); document.getElementById("errsum")?.focus(); return; }
    ui.checkoutErrors = null;
    const pmName = v.pm==="bank"?v.bank:v.pm==="mobilepay"?"MobilePay":"korttimaksu";
    openDialog(`<div class="pad stack" style="text-align:center;padding:40px 24px"><div class="spin" aria-hidden="true"></div><p style="font-weight:600" role="status">Siirrytään maksupalveluun (${esc(pmName)})…</p><p class="hint">Prototyypissä maksu hyväksytään automaattisesti.</p></div>`);
    setTimeout(()=>{
      const t = cartTotals(), order = "VD-"+String(Math.floor(200000+Math.random()*799999)), codes=[];
      for(const l of t.lines) for(let i=0;i<l.qty;i++){
        const code = genCode(); codes.push(code);
        S.vouchers.push({code, deal:l.d.id, opt:l.o.id, price:l.unit, order, email:v.email, bought:+TODAY, status:"active", gift:v.gift?v.gname:null});
      }
      ui.lastOrder = {id:order, codes, total:t.total};
      S.cart = []; save(); ui.form = null;
      dlg.close(); location.hash="#/kiitos";
    }, 1400);
  }
  if(act==="redeem"){
    const code=f.code.value.trim().toUpperCase(), out=document.getElementById("rr");
    const v=S.vouchers.find(x=>x.code===code);
    if(!v){ out.innerHTML=`<div class="notice warn">${ic("xc")}<p><b>Koodia ei löytynyt.</b> Tarkista koodi ja yritä uudelleen.</p></div>`; return; }
    const d=deal(v.deal);
    if(d.merchant!=="Näyte Wellness"){ out.innerHTML=`<div class="notice warn">${ic("xc")}<p><b>Koodi kuuluu toiselle yritykselle</b> (${esc(d.merchant)}). Sitä ei voi lunastaa täällä.</p></div>`; return; }
    if(v.status==="redeemed"){ out.innerHTML=`<div class="notice warn">${ic("xc")}<p><b>Jo käytetty</b> ${fmtDate(v.redeemed)}. Älä anna palvelua uudelleen.</p></div>`; return; }
    if(v.status==="refunded"){ out.innerHTML=`<div class="notice warn">${ic("xc")}<p><b>Hyvitetty lahjakortti.</b> Asiakas on perunut ostoksen. Lahjakortti ei ole enää voimassa.</p></div>`; return; }
    out.innerHTML=`<div class="card pad stack" style="box-shadow:none"><span class="chip teal" style="align-self:flex-start">${ic("checkc")}Voimassa · käyttämätön</span>
      <p style="font-weight:600">${esc(itemTitle(d,optOf(d,v.opt)))}</p><p class="muted small">Voimassa ${fmtDate(addMonths(v.bought,3))} asti${v.gift?` · Lahja: ${esc(v.gift)}`:""}</p>
      <button class="btn btn-primary" data-act="doredeem" data-code="${v.code}">Merkitse lunastetuksi</button></div>`;
  }
  if(act==="newdeal"){
    const price=parseFloat(document.getElementById("np").value)||0, vat=parseFloat(document.getElementById("nv").value);
    S.bizDeals.push({title:f.title.value||"Nimetön diili", price, vat, status:"review", sold:0}); save();
    location.hash="#/yritys"; setTimeout(()=>toast("Lähetetty. Tarkistamme diilin yhden arkipäivän kuluessa."),60);
  }
});

route();
updateBadge();
</script>
