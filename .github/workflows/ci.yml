name: CI

on:
  push:
    branches: [main, prototype, fullstack]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vendelia_test
          POSTGRES_USER: vendelia
          POSTGRES_PASSWORD: vendelia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendelia -d vendelia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://vendelia:vendelia@127.0.0.1:5432/vendelia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
