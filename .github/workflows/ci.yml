name: CI

on:
  push:
    branches: [main, prototype, fullstack]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build frontend (needs the API for server-rendered data)
        run: |
          npm run start -w backend &
          npx --yes wait-on http://127.0.0.1:4000/api/health
          npm run build -w frontend
