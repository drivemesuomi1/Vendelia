# Single application service. Supabase Database/Auth/Storage remain external.
# For Dokploy use the root Dockerfile directly, not this local port mapping.
services:
  web:
    image: vendelia:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      BACKEND_URL: ""
    # Loopback only; put an HTTPS reverse proxy in front for public deployment.
    # 3001 avoids colliding with the Dokploy management interface on host port 3000.
    ports:
      - "127.0.0.1:${VENDELIA_HTTP_PORT:-3001}:3000"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
